[base]
package = ocean
env_name = puffer_grid
vec = multiprocessing
policy_name = Policy
rnn_name = Recurrent

#[policy]
#hidden_size = 512

#[rnn]
#input_size = 512
#hidden_size = 512

[env]
#max_map_size = 32
map_size = 42
num_sims = 512
num_maps = 4096
ema_alpha = 0.001
p_theta = 0.05
num_active_tasks = 32
rand_task_rate = 0.25
sample_threshold = 15
memory = 25
#num_maps = 1

[train]
total_timesteps = 1_000_000_000
checkpoint_interval = 1000
learning_rate = 0.0005978750098629419
gamma = 0.9944336976183826
gae_lambda = 0.9474288929489364
ent_coef = 0.00001
use_e3b = True

num_envs = 1
num_workers = 1
env_batch_size = 1
update_epochs = 4
bptt_horizon = 16
batch_size = 131072
minibatch_size = 16384
compile = False
device = cuda
e3b_coef = 0.01

[sweep]
method = protein
name = sweep

[sweep.metric]
goal = maximize
name = score 
min = 0
max = 1

[sweep.train.total_timesteps]
distribution = log_normal
min = 750000000
max = 1500000000
mean = 9e8
scale = auto

[sweep.train.e3b_coef]
distribution = logit_normal
min = 0.0001
max = 0.99
mean = 0.001
scale = auto

[sweep.train.e3b_lambda]
distribution = log_normal
min = 0.01
max = 10.0
mean = 0.1
scale = auto

[sweep.train.e3b_norm]
distribution = log_normal
min = 0.0001
max = 0.1
mean = 0.001
scale = auto

[sweep.env.ema_alpha]
distribution = logit_normal
min = 0.0001
max = 0.01
mean = 0.001
scale = auto

[sweep.env.p_theta]
distribution = logit_normal
min = 0.001
max = 0.1
mean = 0.005
scale = auto

[sweep.env.num_active_tasks]
distribution = uniform
min = 8
max = 128
mean = 32
scale = auto

[sweep.env.rand_task_rate]
distribution = uniform
min = 0.0
max = 0.5
mean = 0.25
scale = auto

[sweep.env.sample_threshold]
distribution = uniform
min = 5
max = 25
mean = 15
scale = auto

[sweep.env.memory]
distribution = uniform
min = 5
max = 50
mean = 25
scale = auto