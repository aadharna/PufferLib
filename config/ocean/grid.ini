[base]
package = ocean
env_name = puffer_grid
policy_name = Grid 
rnn_name = Recurrent

[env]
max_map_size = 42
num_envs = 512
num_maps = 4096

[lp]
ema_alpha = 0.001
p_theta = 0.05
num_active_tasks = 16
rand_task_rate = 0.2
sample_threshold = 15

[train]
total_timesteps = 1_000_000_000
checkpoint_interval = 1000
learning_rate = 0.0005978750098629419
gamma = 0.9944336976183826
gae_lambda = 0.9474288929489364
ent_coef = 0.00001

num_envs = 1
num_workers = 1
env_batch_size = 1
update_epochs = 4
bptt_horizon = 16
batch_size = 131072
minibatch_size = 16384
compile = False
anneal_lr = False
device = cuda

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 1e9
mean = 2e8
scale = 0.5

[sweep.lp.ema_alpha]
distribution = log_normal
min = 1e-4
max = 1e-2
mean = 1e-3
scale = 0.5

[sweep.lp.p_theta]
distribution = log_normal
min = 1e-4
max = 1e-2
mean = 1e-3
scale = 0.5

[sweep.lp.num_active_tasks]
distribution = uniform
min = 8
max = 256

[sweep.lp.rand_task_rate]
distribution = uniform
min = 0.2
max = 0.6