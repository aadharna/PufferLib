[base]
package = metta
env_name = metta 
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 128
num_workers = 16
batch_size = 64
backend = Serial

[env]
render_mode = auto
num_maps = 64
ema_alpha = 0.001
p_theta = 0.05
num_active_tasks = 16
rand_task_rate = 0.25
sample_threshold = 10
memory = 25
use_lp = True
